<html>

<head>
    <title>To-Do App</title>
    <style>
        :root {
            --black: #000000;
            --surface: #121110;
            --gold: #d4af37;
            --gold-light: #f0d67a;
            --gold-dark: #8f7420;
            --text: #f3ecd6;
            --muted: #8a8370;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 48px 16px;
            min-height: 100vh;
            box-sizing: border-box;
            background-color: var(--black);
            color: var(--text);
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        h1 {
            margin: 0 0 28px;
            padding-bottom: 14px;
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 400;
            font-size: 2.2rem;
            letter-spacing: 0.18em;
            text-align: center;
            color: var(--gold);
            border-bottom: 1px solid var(--gold-dark);
        }

        /* Input + add button */
        #taskinput {
            width: min(360px, 90vw);
            padding: 10px 14px;
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--gold-dark);
            border-radius: 2px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        #taskinput:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25);
        }

        /* !important is needed because the page's inline styles and JS
           set background colors directly on these buttons */
        button {
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            padding: 10px 18px;
            border-radius: 2px;
            transition: background-color 0.15s, color 0.15s, box-shadow 0.15s;
        }
        button:focus-visible {
            outline: 2px solid var(--gold-light);
            outline-offset: 2px;
        }

        #addbutton {
            background-color: var(--gold) !important;
            color: var(--black) !important;
            border: 1px solid var(--gold) !important;
            font-weight: 700;
            margin-left: 8px;
        }
        #addbutton:hover {
            background-color: var(--gold-light) !important;
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.45);
        }

        /* Filter buttons: the script marks the active one with a yellow
           inline background and the others with orange, so we key off that */
        #filter {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }
        #filter button {
            background-color: transparent !important;
            color: var(--gold) !important;
            border: 1px solid var(--gold-dark) !important;
        }
        #filter button:hover {
            border-color: var(--gold) !important;
            color: var(--gold-light) !important;
        }
        #filter button[style*="yellow" i] {
            background-color: var(--gold) !important;
            color: var(--black) !important;
            border-color: var(--gold) !important;
            font-weight: 700;
        }

        /* Task list */
        #container {
            width: min(560px, 92vw);
            margin-top: 28px;
        }
        #task-item {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 14px 4px;
            border-bottom: 1px solid #2a2618;
        }
        #task-item p {
            flex: 1;
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }
        #task-item p[style*="line-through"] {
            color: var(--muted);
            text-decoration-color: var(--gold);
        }
        #task-item input[type="checkbox"] {
            accent-color: var(--gold);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        #delete-btn {
            background-color: transparent;
            color: var(--gold);
            border: 1px solid var(--gold-dark);
            padding: 6px 12px;
        }
        #delete-btn:hover {
            background-color: var(--gold);
            color: var(--black);
            border-color: var(--gold);
        }

        /* Scrollbar */
        html { scrollbar-color: var(--gold-dark) var(--black); }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>
    <h1>MY TO-DO APP</h1>
    <input id="taskinput" />
    <button id="addbutton" style="background-color: orange; color: white;">ADD</button>
    <br>
    <div id="filter">
    <button style = "background-color: orange; color: white;" id="completebtn">COMPLETED TASKS</button>
    <button style = "background-color: orange; color: white;" id="incompletebtn">INCOMPLETE TASKS</button>
    <button style = "background-color: orange; color: white;" id="alltaskbtn">ALL TASKS</button>
    </div>

    <div id="container"></div>
    <script>
        //grab the items
        //grab the items
        let addbtn = document.getElementById("addbutton");
        let taskinput = document.getElementById("taskinput")
        let container = document.getElementById("container")
        let alltskbtn = document.getElementById("alltaskbtn")
        let completebtn = document.getElementById("completebtn")
        let incompletebtn = document.getElementById("incompletebtn")
        let allTasks = []
        if (localStorage.getItem("allTasks")){
            allTasks = JSON.parse(localStorage.getItem("allTasks"))
            showTasks()       }
        //events
        addbtn.addEventListener("click", triggerAdd)
        alltskbtn.addEventListener("click", showTasks)
        completebtn.addEventListener("click", showCompleted)
        incompletebtn.addEventListener("click", showIncomplete)
        function showCompleted() {
            alltskbtn.style.backgroundColor = "Orange"
            incompletebtn.style.backgroundColor = "Orange"
            completebtn.style.backgroundColor = "Yellow"
            container.innerHTML = ""
            for (let num = 0; num < allTasks.length; num += 1) {
                if (allTasks[num].completed == true) {
                    //TODO: add the tick and a slash on the task
                    let template = `<div id="task-item"><input id = '${num}' type = checkbox checked>` + `<p style = 'text-decoration: line-through'>` + allTasks[num].name + `</p>` + `<button id="delete-btn" onclick="triggerdelete(${num})">Delete</button></div>`
                    container.insertAdjacentHTML("beforeend", template);
                    let input = document.getElementById(`${num}`)
                    input.addEventListener("click", triggerundone.bind(null, num))
                }
            }
        }
        function showIncomplete() {
            alltskbtn.style.backgroundColor = "Orange"
            incompletebtn.style.backgroundColor = "Yellow"
            completebtn.style.backgroundColor = "Orange"
            container.innerHTML = ""
            for (let num = 0; num < allTasks.length; num += 1) {
                if (allTasks[num].completed == false) {
                    //TODO: add the tick and a slash on the task
                    let template = `<div id="task-item"><input id = '${num}' type = checkbox>` + `<p>` + allTasks[num].name + `</p>` + `<button id="delete-btn" onclick="triggerdelete(${num})">Delete</button></div>`
                    container.insertAdjacentHTML("beforeend", template);
                    let input = document.getElementById(`${num}`)
                    input.addEventListener("click", triggerundone.bind(null, num))
                }
            }
        }
        function triggerAdd() {
            console.log(taskinput.value);
            //store the new task
            let dictionary = {
                name: taskinput.value,
                completed: false
            }
            allTasks.push(dictionary)
            localStorage.setItem("allTasks", JSON.stringify(allTasks))
            console.log(allTasks)
            showTasks()
        }
        function showTasks() {
            alltskbtn.style.backgroundColor = "Yellow"
            incompletebtn.style.backgroundColor = "Orange"
            completebtn.style.backgroundColor = "Orange"
            container.innerHTML = ""
            for (let num = 0; num < allTasks.length; num += 1) {

                if (allTasks[num].completed == false) {
                    //TODO: show the task without a tick or a slash
                    let template = ` <div id="task-item"><input id = ${num} type = checkbox>` + `<p>` + allTasks[num].name + `</p>` + `<button id="delete-btn" onclick="triggerdelete(${num})">Delete</button></div>`
                    container.insertAdjacentHTML("beforeend", template);
                    //grab the input
                    let input = document.getElementById(`${num}`)
                    input.addEventListener("click", triggerdone.bind(null, num))

                }
                else if (allTasks[num].completed == true) {
                    //TODO: add the tick and a slash on the task
                    let template = `<div id="task-item"><input id = '${num}' type = checkbox checked>` + `<p style = 'text-decoration: line-through'>` + allTasks[num].name + `</p>` + `<button id="delete-btn" onclick="triggerdelete(${num})">Delete</button></div>`
                    container.insertAdjacentHTML("beforeend", template);
                    let input = document.getElementById(`${num}`)
                    input.addEventListener("click", triggerundone.bind(null, num))
                }

            }
        }
        function triggerdone(num) {
            console.log("done", num)
            allTasks[num].completed = true
            localStorage.setItem("allTasks", JSON.stringify(allTasks))
            showTasks()
        }
        function triggerundone(num) {
            console.log("undone", num)
            allTasks[num].completed = false
            localStorage.setItem("allTasks", JSON.stringify(allTasks))
            showTasks()
        }
        function triggerdelete(num){
            allTasks.splice(num,1)
            localStorage.setItem("allTasks", JSON.stringify(allTasks))
            showTasks()

        }

    </script>

</body>

</html>
